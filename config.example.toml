# ============ 贴表情 ============
[plugin]
# 关掉之后，回复消息不会再贴任何表情
enabled = true
# 配置版本号，由插件维护，请勿手动修改（WebUI 里不显示）
config_version = "0.4.0"
# 贴表情概率，0 ~ 1：1 = 每次都贴，0 = 完全不贴，中间值按概率（WebUI 里是滑条）
# 没抽中时什么都不做，引用框与消息内容完全不受影响
react_probability = 1.0
# 每次贴几个表情（WebUI 里是滑条）；从表情池随机抽，池子不够时按池子大小封顶
emoji_count = 1
# 美化配置页：分组卡片、滑条数值可直接输入。默认关闭。
# 打开会往 maibot_dashboard 的 dist 目录写两个文件（index.html 内嵌一段 + dist/assets 下俩资源），
# 重载整个 WebUI 页面（F5）才生效；关掉即还原。dashboard 升级会覆盖掉，需重拨一次。
# 不想用开关，也可以手动跑 python tools/inject_webui.py（加 --remove 移除）
beautify_ui = false

# ============ 表情池 ============
[emoji]
# 两种编号都收，都写十进制，可填多个，每次随机抽：
#   ① QQ 系统表情 → face id：478 = [对的对的]（默认）  14 = 微笑  76 = 赞  182 = 笑哭
#   ② Unicode emoji  → 十进制码点：🐛 = 128027   😧 = 128551   ✅ = 9989
# 系统表情限 QQ 目录里的 299 个（插件 docs/qq-face-ids.md，含 190 个新版）；
# Unicode emoji 不受这表限制，任意 emoji 都能用。
# 在线速查器（搜索/筛选/一键复制/emoji 换算）：https://52-moyna.github.io/maibot_plugin-Response/face-lookup.html
# 查某个系统表情的真实 id：用 /get_msg 取那条消息，看 segments 里 face 段的 "id"
# 注意：不要填 1F41B / 2705 这类十六进制值，接口会返回 ok 但客户端贴出来是空白
emoji_pool = ["478"]
# 表情池为空时用它兜底，一般不用管
emoji_id = "478"

# ============ 分群设置 ============
# 给指定群单独设规矩：写到的群按本群设置跑，没写到的群走上面的全局配置，互不影响。
# 平时不用手写 —— WebUI 的「分群设置」卡片里点「添加项目」就行。
# mode: "inherit（沿用全局）" / "custom（自定义）" / "off（不贴表情）"
[group]
# 示例（去掉 # 即可生效，群号换成实际的）：
# [[group.rules]]
# group_id = "862129543"
# mode = "custom（自定义）"
# react_probability = 0.5
# emoji_count = 2
# emoji_pool = ["478", "14"]

# ============ 连接 ============
[network]
# OneBot v11 HTTP 服务（本机 SnowLuma 网关在 3000 端口；NapCat 常见 9999）
host = "127.0.0.1"
port = 3000
# 鉴权头。SnowLuma 严格校验 "Authorization: Bearer <token>"，前缀要一起写
token = "Bearer <你的 token>"
# 单次贴表情请求超时（秒）；超时只记日志，不影响消息发送
timeout_seconds = 5
