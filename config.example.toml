# ============ 贴表情 ============
[plugin]
# 关掉之后，回复消息不会再贴任何表情
enabled = true
# 配置版本号，由插件维护，请勿手动修改（WebUI 里不显示）
config_version = "0.4.0"
# 贴表情概率，0 ~ 1：1 = 每次都贴，0 = 完全不贴，中间值按概率（WebUI 里是滑条）
# 没抽中时什么都不做，引用框与消息内容完全不受影响
react_probability = 1.0
# 每次贴几个表情（WebUI 里是滑条）；从表情池随机抽，池子不够时按池子大小封顶
emoji_count = 1
# 美化配置页：分组卡片、滑条数值可直接输入。关掉即还原成 dashboard 默认样式
beautify_ui = true

# ============ 表情池 ============
[emoji]
# QQ 表情的 face id（十进制），可填多个，每次随机抽
#   478 = [对的对的]（默认）  14 = 微笑  13 = 呲牙  76 = 赞  66 = 爱心  124 = OK  182 = 笑哭  32 = 疑问
# CQ 码 / face id 大全：https://docs.go-cqhttp.org/cqcode/
# 查某个表情的真实 id：用 /get_msg 取那条消息，看 segments 里 face 段的 "id"
# 注意：不要填 2705 这类 Unicode 十六进制值，接口会返回 ok 但客户端贴出来是空白
emoji_pool = ["478"]
# 表情池为空时用它兜底，一般不用管
emoji_id = "478"

# ============ 连接 ============
[network]
# OneBot v11 HTTP 服务（本机 SnowLuma 网关在 3000 端口；NapCat 常见 9999）
host = "127.0.0.1"
port = 3000
# 鉴权头。SnowLuma 严格校验 "Authorization: Bearer <token>"，前缀要一起写
token = "Bearer <你的 token>"
# 单次贴表情请求超时（秒）；超时只记日志，不影响消息发送
timeout_seconds = 5
