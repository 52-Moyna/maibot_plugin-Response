[plugin]
# 是否启用：回复某条消息时，在那条消息上贴表情回应
enabled = true
# 配置版本号，由插件维护，请勿手动修改
config_version = "0.2.0"

# 贴表情概率，0 ~ 1：
#   1.0 = 每次都贴（默认）
#   0.5 = 一半概率贴
#   0   = 完全不贴（等同于关闭贴表情功能）
# 没抽中时本插件也不会去摘引用框，那条消息保持宿主原样。
react_probability = 1.0

# 用表情替代引用框：
#   true  = 只贴表情，不显示灰色引用框（推荐，最像真人）
#   false = 引用框和表情回应同时出现
replace_quote = true

# 表情池：填 QQ 表情的 face id（十进制），可填多个，每次从池里随机抽。
#   478 = [对的对的]（默认，黄脸举绿勾牌）
#    14 = 微笑   13 = 呲牙   76 = 赞   66 = 爱心   124 = OK   182 = 笑哭   32 = 疑问
# 表情 CQ 码 / face id 大全：https://docs.go-cqhttp.org/cqcode/
# 查某个表情的真实 id：用 /get_msg 取那条消息，看 segments 里 face 段的 "id"
# 注意：不要填 Unicode 十六进制值（如 2705），接口会返回 ok 但客户端贴出来是空白
emoji_pool = ["478"]

# 每次贴几个表情。从表情池里随机抽取，池子不够时按池子大小封顶。
emoji_count = 1

# 备用表情 ID：表情池为空时用这个，一般不用管
emoji_id = "478"

# OneBot v11 HTTP 服务（本机 SnowLuma 网关在 3000 端口；NapCat 常见 9999）
host = "127.0.0.1"
port = 3000

# 鉴权头。SnowLuma 严格校验 "Authorization: Bearer <token>"，前缀要一起写
token = "Bearer <你的 token>"

# 单次贴表情请求超时（秒）
timeout_seconds = 5
